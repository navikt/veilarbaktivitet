name: Deploy feature branch GCP
run-name: Deploy feature branch ${{ github.ref_name }} by @${{ github.actor }}
on:
  workflow_dispatch:

concurrency:
  group: deploy_feature_branch_gcp
  cancel-in-progress: true

env:
  PRINT_PAYLOAD: true
jobs:
  build:
    name: Build, push
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.docker-build-push.outputs.image }}
      telemetry: ${{ steps.docker-build-push.outputs.telemetry }}
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6
      - name: Execute Gradle build
        run: ./gradlew assemble --scan
      - name: Push docker image to GAR
        uses: nais/docker-build-push@dd7421d5068057a020ca46ead966c26190c516b1
        id: docker-build-push
        with:
          team: dab
        env:
          TRIVY_JAVA_DB_REPOSITORY: "public.ecr.aws/aquasecurity/trivy-java-db:1" # avoid rate limiting on javadb download
  deploy:
      name: Deploy to gcp dev
      needs: build
      runs-on: ubuntu-latest
      permissions:
        id-token: write
      steps:
        - name: Checkout
          uses: actions/checkout@v7
        - name: Deploy
          uses: nais/deploy/actions/deploy@f93637de5533a1bb573f940ceb7527a5b3b0dea0
          env:
            CLUSTER: dev-gcp
            RESOURCE: nais/nais-dev-gcp.yaml
            VAR: image=${{ needs.build.outputs.image }}
            TELEMETRY: ${{ needs.build.outputs.telemetry }}
