name: AsyncAPI schemas gh pages

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/asyncApiSchemas.yml'
      - 'src/main/resources/schemas/**'

permissions:
  contents: write

concurrency:
  group: AktivitetskortV1.asyncapi.schema
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Deploy 🚀
        uses: JamesIves/github-pages-deploy-action@fa24774553152dd7873cd16ebd8d959b010c5445
        with:
          folder: src/main/resources/schemas
          target-folder: schemas
